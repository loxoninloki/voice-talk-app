<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声トーク</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: sans-serif;
  background: #f6f2ff;
  color: #333;
}
header {
  background: #a58bd4;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 22px;
}
main {
  padding: 16px;
  max-width: 600px;
  margin: auto;
}
#messages {
  height: 55vh;
  overflow-y: auto;
  background: white;
  border-radius: 16px;
  padding: 15px;
}
.message {
  background: #eee5ff;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 12px;
  overflow-wrap: anywhere;
}
.controls {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
}
button {
  background: #9876cf;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
}
</style>
</head>
<body>

<header>音声トーク</header>

<main>
  <div id="messages"></div>

  <div class="controls">
    <input id="text" placeholder="メッセージを入力">
    <button onclick="send()">送信</button>
    <button onclick="startVoiceInput()">🎤</button>
  </div>

<button onclick="enableVoice()">🔊 音声ON</button>

<button onclick="copyInviteURL()">🔗 招待URLをコピー</button>

<button onclick="createNewRoom()">＋ 新しいルームを作成</button>

  <p>女性音声でメッセージを読み上げます。</p>
</main>

<script>

function createNewRoom() {
  const confirmed = confirm(
    "新しい会話ルームを作成しますか？\n現在のルームから移動します。"
  );

  if (!confirmed) return;

  const roomId = crypto.randomUUID();
  
sessionStorage.setItem("room-creator-" + roomId, "pending");

  const url = new URL(window.location.href);

  url.search = "";
  url.searchParams.set("room", roomId);

  window.location.href = url.toString();
}

function copyInviteURL() {
  const url = new URL(window.location.href);

  if (!url.searchParams.get("room")) {
    url.searchParams.set("room", crypto.randomUUID());
  }

  navigator.clipboard.writeText(url.toString())
    .then(() => {
      alert("招待URLをコピーしました！");
    })
    .catch(() => {
      prompt("このURLをコピーしてください", url.toString());
    });
}

let voiceEnabled = false;

function enableVoice() {
  if (!("speechSynthesis" in window)) {
    alert("この端末は音声読み上げに対応していません");
    return;
  }

  voiceEnabled = true;
  speechSynthesis.cancel();

  const test = new SpeechSynthesisUtterance(
    "音声の準備ができました"
  );
  test.lang = "ja-JP";
  speechSynthesis.speak(test);
}

function speak(message) {
  if (!("speechSynthesis" in window)) {
    alert("この端末では読み上げを利用できません");
    return;
  }

  speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(message);
  voice.lang = "ja-JP";
  voice.rate = 0.9;

  const voices = speechSynthesis.getVoices();
  const japanese = voices.filter(v =>
    v.lang.startsWith("ja")
  );

  const female = japanese.find(v =>
    /Kyoko|Otoya|Siri|女性/i.test(v.name)
  );

  if (female) voice.voice = female;

  speechSynthesis.speak(voice);
}

function send() {
  const input = document.getElementById("text");
  const message = input.value.trim();

  if (!message) return;

  const box = document.getElementById("messages");
  const item = document.createElement("div");

  item.className = "message";
  item.textContent = message;

  box.appendChild(item);
  box.scrollTop = box.scrollHeight;

  input.value = "";


window.saveMessageToFirebase?.(message);
}

function startVoiceInput() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("このブラウザでは音声認識に対応していません。キーボードのマイクも利用できます。");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ja-JP";
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    document.getElementById("text").value = text;
  };

  recognition.onerror = function(event) {
    alert("音声認識エラー: " + event.error);
  };

  recognition.start();
}
</script>

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";




import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp,
  doc,
  setDoc,
  getDoc,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuLI2RIVfEu5pkbJNgSXfHFFItc-aY7fg",
  authDomain: "voice-talk-app-b33c2.firebaseapp.com",
  projectId: "voice-talk-app-b33c2",
  storageBucket: "voice-talk-app-b33c2.firebasestorage.app",
  messagingSenderId: "1083145521643",
  appId: "1:1083145521643:web:2266cc86edd27b3babb1ae",
  measurementId: "G-WHS9YMF59V"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

console.log("Firebase接続準備OK");


signInAnonymously(auth)
  .then(async (result) => {
    const uid = result.user.uid;
    console.log("匿名ログイン成功:", uid);

    const newRoomId = new URLSearchParams(
      window.location.search
    ).get("room");

   
if (!newRoomId) return;

if (newRoomId === "test-room") {
  startMessagesListener();
  return;
}

    const roomRef = doc(db, "rooms", newRoomId);
    const creatorKey = "room-creator-" + newRoomId;

    if (sessionStorage.getItem(creatorKey) === "pending") {
      await setDoc(roomRef, {
        ownerId: uid,
        members: [uid],
        createdAt: serverTimestamp()
      });

      sessionStorage.removeItem(creatorKey);
      console.log("ルーム作成完了");
      
startMessagesListener();

      return;
    }

    await runTransaction(db, async (transaction) => {
      const roomSnapshot = await transaction.get(roomRef);

      if (!roomSnapshot.exists()) {
        throw new Error("ルームが見つかりません");
      }

      const members = roomSnapshot.data().members || [];

      if (members.includes(uid)) return;

      if (members.length >= 2) {
        throw new Error("このルームは満員です");
      }

      transaction.update(roomRef, {
        members: [...members, uid]
      });
    });

    console.log("ルーム参加完了");
    
startMessagesListener();

  })
  .catch((error) => {
    console.error("ルーム初期化エラー:", error);
    alert("ルーム初期化エラー: " + error.message);
  });



async function saveMessage(text) {
if (!roomId) {
  alert("会話ルームが指定されていません");
  return;
}
    if (!auth.currentUser) {
    console.error("ログインが完了していません");
    return;
  }

  try {
await addDoc(
  collection(db, "rooms", roomId, "messages"),
  {
    text: text,
    uid: auth.currentUser.uid,
    createdAt: serverTimestamp()
  }
);
    console.log("メッセージ保存成功");
  } catch (error) {
    console.error("メッセージ保存失敗:", error);
  alert("保存エラー: " + error.code + " / " + error.message);
  }
}

window.saveMessageToFirebase = saveMessage;

const roomId = new URLSearchParams(
  window.location.search
).get("room");

console.log("現在のルームID:", roomId);

const currentUserId = () => auth.currentUser?.uid ?? null;


function startMessagesListener() {
  if (!roomId) return;
  const messagesQuery = query(
    collection(db, "rooms", roomId, "messages"),
    orderBy("createdAt", "asc")
  );

  
  
  let firstLoad = true;

  onSnapshot(messagesQuery, (snapshot) => {
    const box = document.getElementById("messages");
    box.replaceChildren();

    snapshot.forEach((doc) => {
      const data = doc.data();
      const item = document.createElement("div");

      item.className = "message";
      item.textContent = data.text || "";

      if (data.uid === currentUserId()) {
        item.style.marginLeft = "20%";
        item.style.background = "#d9c8fa";
      } else {
        item.style.marginRight = "20%";
        item.style.background = "#eeeeee";
      }

      box.appendChild(item);
    });

    box.scrollTop = box.scrollHeight;

    if (!firstLoad) {
      snapshot.docChanges().forEach((change) => {
        if (
          change.type === "added" &&
          !change.doc.metadata.hasPendingWrites &&
          change.doc.data().uid !== currentUserId()
        ) {
          speak(change.doc.data().text || "");
        }
      });
    }

    firstLoad = false;
  }, (error) => {
    console.error("受信エラー:", error);
    alert("受信エラー: " + error.code);
  });


}

</script>


</body>
</html>
