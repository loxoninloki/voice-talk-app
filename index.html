<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声トーク</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: sans-serif;
  background: #f6f2ff;
  color: #333;
}
header {
  background: #a58bd4;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 22px;
}
main {
  padding: 16px;
  max-width: 600px;
  margin: auto;
}
#messages {
  height: 55vh;
  overflow-y: auto;
  background: white;
  border-radius: 16px;
  padding: 15px;
}
.message {
  background: #eee5ff;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 12px;
  overflow-wrap: anywhere;
}
.controls {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
}
button {
  background: #9876cf;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
}
</style>
</head>
<body>

<header>音声トーク</header>

<main>
  <div id="messages"></div>

  <div class="controls">
    <input id="text" placeholder="メッセージを入力">
    <button onclick="send()">送信</button>
    <button onclick="startVoiceInput()">🎤</button>
  </div>
  
<button id="callButton" onclick="toggleCallMic()">
  📞 通話マイクON
</button>
<p id="callStatus">通話マイク：OFF</p>

<audio id="remoteAudio" autoplay playsinline></audio>


<button id="startCallButton" onclick="startCall()">
  📞 通話開始
</button>

<p id="incomingCallStatus">
  着信待機中
</p>



<button id="answerCallButton" onclick="answerCall()">

  📞 着信に応答
</button>


<button onclick="enableVoice()">🔊 音声ON</button>

<button onclick="copyInviteURL()">🔗 招待URLをコピー</button>

<button onclick="createNewRoom()">＋ 新しいルームを作成</button>

  <p>女性音声でメッセージを読み上げます。</p>
</main>

<script>

let callStream = null;

async function toggleCallMic() {
  const button = document.getElementById("callButton");
  const status = document.getElementById("callStatus");

  if (callStream) {
    callStream.getTracks().forEach(track => track.stop());
    callStream = null;
    button.textContent = "📞 通話マイクON";
    status.textContent = "通話マイク：OFF";
    return;
  }

  try {
    callStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });

    button.textContent = "🔴 通話マイクOFF";
    status.textContent = "マイク準備完了（接続前）";
  } catch (error) {
    console.error("マイクエラー:", error);
    alert("マイクを利用できません。Safariの許可設定を確認してください。");
  }
}


function createNewRoom() {
  const confirmed = confirm(
    "新しい会話ルームを作成しますか？\n現在のルームから移動します。"
  );

  if (!confirmed) return;

  const roomId = crypto.randomUUID();
  
sessionStorage.setItem("room-creator-" + roomId, "pending");

  const url = new URL(window.location.href);

  url.search = "";
  url.searchParams.set("room", roomId);

  window.location.href = url.toString();
}

function copyInviteURL() {
  const url = new URL(window.location.href);

  if (!url.searchParams.get("room")) {
    url.searchParams.set("room", crypto.randomUUID());
  }

  navigator.clipboard.writeText(url.toString())
    .then(() => {
      alert("招待URLをコピーしました！");
    })
    .catch(() => {
      prompt("このURLをコピーしてください", url.toString());
    });
}

let voiceEnabled = false;

function enableVoice() {
  if (!("speechSynthesis" in window)) {
    alert("この端末は音声読み上げに対応していません");
    return;
  }

  voiceEnabled = true;
  speechSynthesis.cancel();

  const test = new SpeechSynthesisUtterance(
    "音声の準備ができました"
  );
  test.lang = "ja-JP";
  speechSynthesis.speak(test);
}

function speak(message) {
  if (!("speechSynthesis" in window)) {
    alert("この端末では読み上げを利用できません");
    return;
  }

  speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(message);
  voice.lang = "ja-JP";
  voice.rate = 0.9;

  const voices = speechSynthesis.getVoices();
  const japanese = voices.filter(v =>
    v.lang.startsWith("ja")
  );

  const female = japanese.find(v =>
    /Kyoko|Otoya|Siri|女性/i.test(v.name)
  );

  if (female) voice.voice = female;

  speechSynthesis.speak(voice);
}

function send() {
  const input = document.getElementById("text");
  const message = input.value.trim();

  if (!message) return;

  const box = document.getElementById("messages");
  const item = document.createElement("div");

  item.className = "message";
  item.textContent = message;

  box.appendChild(item);
  box.scrollTop = box.scrollHeight;

  input.value = "";


window.saveMessageToFirebase?.(message);
}

function startVoiceInput() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("このブラウザでは音声認識に対応していません。キーボードのマイクも利用できます。");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ja-JP";
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    document.getElementById("text").value = text;
  };

  recognition.onerror = function(event) {
    alert("音声認識エラー: " + event.error);
  };

  recognition.start();
}
</script>

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";




import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp,
  doc,
  setDoc,
  updateDoc,
  getDoc,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuLI2RIVfEu5pkbJNgSXfHFFItc-aY7fg",
  authDomain: "voice-talk-app-b33c2.firebaseapp.com",
  projectId: "voice-talk-app-b33c2",
  storageBucket: "voice-talk-app-b33c2.firebasestorage.app",
  messagingSenderId: "1083145521643",
  appId: "1:1083145521643:web:2266cc86edd27b3babb1ae",
  measurementId: "G-WHS9YMF59V"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

console.log("Firebase接続準備OK");

const rtcConfig = {
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    }
  ]
};

let peerConnection = null;
let remoteAudioStream = null;

function createPeerConnection() {
  peerConnection = new RTCPeerConnection(rtcConfig);

  
peerConnection.ontrack = (event) => {
  remoteAudioStream = event.streams[0];

  const audio = document.getElementById("remoteAudio");
  audio.srcObject = remoteAudioStream;

  audio.play().catch((error) => {
    console.log("音声の自動再生待ち:", error);
  });

  console.log("相手の音声を受信しました");
};


  peerConnection.onconnectionstatechange = () => {
    console.log(
      "通話接続状態:",
      peerConnection.connectionState
    );
  };

  return peerConnection;
}

console.log("WebRTC準備完了");

function setupIceCandidateSender(pc, callRef, role) {
  const collectionName =
    role === "caller"
      ? "offerCandidates"
      : "answerCandidates";

  const candidatesRef = collection(
    callRef,
    collectionName
  );

  pc.onicecandidate = async (event) => {
    if (!event.candidate) return;

    try {
      await addDoc(
        candidatesRef,
        event.candidate.toJSON()
      );

      console.log(
        "ICE候補を保存:",
        collectionName
      );
    } catch (error) {
      console.error(
        "ICE候補保存エラー:",
        error
      );
    }
  };
}

function setupIceCandidateReceiver(pc, callRef, role) {
  const collectionName =
    role === "caller"
      ? "answerCandidates"
      : "offerCandidates";

  const candidatesRef = collection(
    callRef,
    collectionName
  );

  return onSnapshot(candidatesRef, (snapshot) => {
    snapshot.docChanges().forEach(async (change) => {
      if (change.type !== "added") return;

      try {
        const candidate = new RTCIceCandidate(
          change.doc.data()
        );

        if (pc.remoteDescription) {
          await pc.addIceCandidate(candidate);
        } else {
          if (!pc.pendingIceCandidates) {
            pc.pendingIceCandidates = [];
          }

          pc.pendingIceCandidates.push(candidate);
        }
      } catch (error) {
        console.error("ICE候補受信エラー:", error);
      }
    });
  });
}

async function applyPendingIceCandidates(pc) {
  const candidates = pc.pendingIceCandidates || [];

  for (const candidate of candidates) {
    await pc.addIceCandidate(candidate);
  }

  pc.pendingIceCandidates = [];
}


let unsubscribeCallAnswer = null;

async function startCall() {
  if (!auth.currentUser || !roomId) {
    alert("ルームへの接続が完了していません");
    return;
  }

  if (!callStream) {
    alert("先に通話マイクをONにしてください");
    return;
  }

  try {
    const pc = createPeerConnection();

    callStream.getTracks().forEach((track) => {
      pc.addTrack(track, callStream);
    });

    const callRef = doc(
      collection(db, "rooms", roomId, "calls")
    );



setupIceCandidateReceiver(pc, callRef, "caller");

    const offer = await pc.createOffer();


    
await setDoc(callRef, {
  callerId: auth.currentUser.uid,
  offer: {
    type: offer.type,
    sdp: offer.sdp
  },
  createdAt: serverTimestamp()
});

setupIceCandidateSender(pc, callRef, "caller");

await pc.setLocalDescription(offer);


    console.log("通話接続要求を保存:", callRef.id);

unsubscribeCallAnswer = onSnapshot(
  callRef,
  async (snapshot) => {
    const data = snapshot.data();

    if (!data?.answer || pc.remoteDescription) {
      return;
    }

    try {
      await pc.setRemoteDescription(
        new RTCSessionDescription(data.answer)
      );

      await applyPendingIceCandidates(pc);

      document.getElementById("callStatus").textContent =
        "相手の応答を受信しました（接続中）";

      console.log("相手の応答を受信しました");
    } catch (error) {
      console.error("応答受信エラー:", error);
    }
  }
);

    document.getElementById("callStatus").textContent =
      "発信準備完了（相手の応答待ち）";

  } catch (error) {
    console.error("発信エラー:", error);
    alert("発信エラー: " + error.message);
  }
}

window.startCall = startCall;

async function answerCall() {
  if (!incomingCallId || !roomId) {
    alert("応答する着信がありません");
    return;
  }

  if (!callStream) {
    alert("先に通話マイクをONにしてください");
    return;
  }

  try {
    const callRef = doc(
      db, "rooms", roomId, "calls", incomingCallId
    );

    const callSnapshot = await getDoc(callRef);

    if (!callSnapshot.exists()) {
      throw new Error("通話が見つかりません");
    }

    const callData = callSnapshot.data();

    if (!callData.offer || callData.answer) {
      throw new Error("応答できない通話です");
    }

    const pc = createPeerConnection();

setupIceCandidateSender(pc, callRef, "answerer");

setupIceCandidateReceiver(pc, callRef, "answerer");

    callStream.getTracks().forEach((track) => {
      pc.addTrack(track, callStream);
    });

    await pc.setRemoteDescription(
      new RTCSessionDescription(callData.offer)
    );

await applyPendingIceCandidates(pc);

    const answer = await pc.createAnswer();


    await updateDoc(callRef, {
      answer: {
        type: answer.type,
        sdp: answer.sdp
      },
      answererId: auth.currentUser.uid
    });

await pc.setLocalDescription(answer);

    document.getElementById("callStatus").textContent =
      "応答データ保存完了（接続準備中）";

    console.log("通話応答を保存しました");

  } catch (error) {
    console.error("着信応答エラー:", error);
    alert("着信応答エラー: " + error.message);
  }
}

window.answerCall = answerCall;


let incomingCallId = null;

let unsubscribeIncomingCalls = null;

function startIncomingCallListener() {
  if (!roomId || !auth.currentUser) return;

  if (unsubscribeIncomingCalls) {
    unsubscribeIncomingCalls();
  }

  const callsRef = collection(
    db, "rooms", roomId, "calls"
  );

  unsubscribeIncomingCalls = onSnapshot(
    callsRef,
    (snapshot) => {
      const status = document.getElementById(
        "incomingCallStatus"
      );

      const incoming = snapshot.docs.find((callDoc) => {
        const data = callDoc.data();

        
const createdAt = data.createdAt?.toMillis?.();
const isRecent =
  createdAt &&
  Date.now() - createdAt < 5 * 60 * 1000;

return (
  data.callerId !== auth.currentUser.uid &&
  data.offer &&
  !data.answer &&
  isRecent
);

      });


if (incoming) {
  incomingCallId = incoming.id;

  status.textContent = "📞 着信があります";

  document.getElementById(
    "answerCallButton"
  ).textContent = "📞 着信に応答（準備中）";

  console.log("着信検知:", incoming.id);
} else {
  incomingCallId = null;
  status.textContent = "着信待機中";
}

    },
    (error) => {
      console.error("着信監視エラー:", error);
      document.getElementById(
        "incomingCallStatus"
      ).textContent = "着信監視エラー: " + error.code;
    }
  );
}

signInAnonymously(auth)
  .then(async (result) => {
    const uid = result.user.uid;
    console.log("匿名ログイン成功:", uid);

    const newRoomId = new URLSearchParams(
      window.location.search
    ).get("room");

   
if (!newRoomId) return;

if (newRoomId === "test-room") {
  startMessagesListener();
  startIncomingCallListener();
  return;
}

    const roomRef = doc(db, "rooms", newRoomId);
    const creatorKey = "room-creator-" + newRoomId;

    if (sessionStorage.getItem(creatorKey) === "pending") {
      await setDoc(roomRef, {
        ownerId: uid,
        members: [uid],
        createdAt: serverTimestamp()
      });

      sessionStorage.removeItem(creatorKey);
      console.log("ルーム作成完了");
      
startMessagesListener();
startIncomingCallListener();
      return;
    }

    await runTransaction(db, async (transaction) => {
      const roomSnapshot = await transaction.get(roomRef);

      if (!roomSnapshot.exists()) {
        throw new Error("ルームが見つかりません");
      }

      const members = roomSnapshot.data().members || [];

      if (members.includes(uid)) return;

      if (members.length >= 2) {
        throw new Error("このルームは満員です");
      }

      transaction.update(roomRef, {
        members: [...members, uid]
      });
    });

    console.log("ルーム参加完了");
    
startMessagesListener();
startIncomingCallListener();
  })
  .catch((error) => {
    console.error("ルーム初期化エラー:", error);
    alert("ルーム初期化エラー: " + error.message);
  });



async function saveMessage(text) {
if (!roomId) {
  alert("会話ルームが指定されていません");
  return;
}
    if (!auth.currentUser) {
    console.error("ログインが完了していません");
    return;
  }

  try {
await addDoc(
  collection(db, "rooms", roomId, "messages"),
  {
    text: text,
    uid: auth.currentUser.uid,
    createdAt: serverTimestamp()
  }
);
    console.log("メッセージ保存成功");
  } catch (error) {
    console.error("メッセージ保存失敗:", error);
  alert("保存エラー: " + error.code + " / " + error.message);
  }
}

window.saveMessageToFirebase = saveMessage;

const roomId = new URLSearchParams(
  window.location.search
).get("room");

console.log("現在のルームID:", roomId);

const currentUserId = () => auth.currentUser?.uid ?? null;


function startMessagesListener() {
  if (!roomId) return;
  const messagesQuery = query(
    collection(db, "rooms", roomId, "messages"),
    orderBy("createdAt", "asc")
  );

  
  
  let firstLoad = true;

  onSnapshot(messagesQuery, (snapshot) => {
    const box = document.getElementById("messages");
    box.replaceChildren();

    snapshot.forEach((doc) => {
      const data = doc.data();
      const item = document.createElement("div");

      item.className = "message";
      item.textContent = data.text || "";

      if (data.uid === currentUserId()) {
        item.style.marginLeft = "20%";
        item.style.background = "#d9c8fa";
      } else {
        item.style.marginRight = "20%";
        item.style.background = "#eeeeee";
      }

      box.appendChild(item);
    });

    box.scrollTop = box.scrollHeight;

    if (!firstLoad) {
      snapshot.docChanges().forEach((change) => {
        if (
          change.type === "added" &&
          !change.doc.metadata.hasPendingWrites &&
          change.doc.data().uid !== currentUserId()
        ) {
          speak(change.doc.data().text || "");
        }
      });
    }

    firstLoad = false;
  }, (error) => {
    console.error("受信エラー:", error);
    alert("受信エラー: " + error.code);
  });


}

</script>


</body>
</html>
