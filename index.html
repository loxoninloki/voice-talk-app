<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声トーク</title>
<style>
:root {
  color-scheme: light;
  --ink: #403454;
  --ink-soft: #796d8f;
  --violet: #8b70cb;
  --violet-deep: #7756b8;
  --lavender: #f1e9fc;
  --line: #e8def5;
  --white: #fff;
  --shadow: 0 8px 28px rgba(96, 69, 140, .09);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  color: var(--ink);
  background: #f8f4ff;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button {
  min-height: 44px;
  border: 0;
  border-radius: 14px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .14s, background .14s, opacity .14s;
}
button:active { transform: scale(.98); }
button:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 3px solid #b49ae4;
  outline-offset: 2px;
}
button:disabled { opacity: .5; cursor: not-allowed; }
.app-shell {
  height: 100vh;
  height: 100dvh;
  max-width: 760px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(circle at 98% 0%, #ebdcff 0, transparent 45%),
    radial-gradient(circle at 0% 90%, #e8eafe 0, transparent 43%),
    #f9f6ff;
}
.topbar {
  padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 15px;
  flex-shrink: 0;
  color: #fff;
  font-size: 22px;
  background: linear-gradient(145deg, #bca2ef, #8667c6);
  box-shadow: 0 5px 13px rgba(137, 105, 197, .22);
}
.brand-copy { min-width: 0; flex: 1; }
.brand-copy h1 { font-size: 17px; margin: 0; letter-spacing: .02em; line-height: 1.3; }
.brand-copy p { font-size: 10px; color: var(--ink-soft); margin: 3px 0 0; }
.brand-heart { color: #b495df; font-size: 22px; }
.app-main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 0 12px calc(9px + env(safe-area-inset-bottom, 0px));
}
.connection-panel, .chat-panel, .call-panel, .extras {
  border: 1px solid rgba(222, 211, 241, .86);
  background: rgba(255, 255, 255, .92);
  box-shadow: var(--shadow);
  border-radius: 20px;
}
.connection-panel { flex-shrink: 0; padding: 10px 14px; }
.connection-top, .chat-heading, .panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.eyebrow, .panel-title {
  color: var(--ink-soft);
  font-weight: 750;
  font-size: 11px;
  letter-spacing: .04em;
}
.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ae96dc;
  margin-right: 5px;
  vertical-align: middle;
}
.pill {
  font-size: 10px;
  font-weight: 750;
  color: #8265b7;
  background: #f2ebfc;
  border-radius: 999px;
  padding: 4px 10px;
}
#callStatus {
  margin: 6px 0 2px;
  font-size: 14px;
  font-weight: 800;
  min-height: 18px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#incomingCallStatus {
  margin: 0;
  font-size: 10px;
  line-height: 1.3;
  color: var(--ink-soft);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chat-panel {
  display: flex;
  flex-direction: column;
  min-height: 0;
  flex: 1;
  overflow: hidden;
}
.chat-heading {
  padding: 11px 14px 9px;
  flex-shrink: 0;
}
.chat-heading h2 {
  margin: 0;
  font-size: 13px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.chat-hint { color: var(--ink-soft); font-size: 10px; }
#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 12px;
  background: linear-gradient(160deg, #faf8ff 0%, #fff 70%);
  border-top: 1px solid #f0eaf8;
  border-bottom: 1px solid #f0eaf8;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#messages:empty::before {
  content: "ここから会話が始まります ✨";
  align-self: center;
  margin: auto;
  color: #a194b5;
  font-size: 12px;
}
.message {
  display: block;
  flex-shrink: 0;
  max-width: 86%;
  width: fit-content;
  margin: 0;
  padding: 9px 12px;
  border-radius: 17px 17px 17px 5px;
  background: #f0ebf7;
  color: #493e58;
  font-size: 13px;
  line-height: 1.55;
  overflow-wrap: anywhere;
  box-shadow: 0 2px 7px rgba(102, 79, 142, .06);
}
.message.mine {
  align-self: flex-end;
  background: #e5d7fa;
  border-radius: 17px 17px 5px 17px;
}
.message.theirs { align-self: flex-start; }
.controls {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px;
  flex-shrink: 0;
}
.controls input {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #faf8ff;
  font-size: 16px;
  color: var(--ink);
}
.controls input::placeholder { color: #aaa0b8; }
.icon-button {
  flex: 0 0 44px;
  width: 44px;
  padding: 0;
  font-size: 18px;
  background: #f0e7fa;
  color: var(--violet-deep);
}
.send-button {
  padding: 0 16px;
  flex-shrink: 0;
  color: white;
  background: linear-gradient(135deg, #a68add, #8667c8);
  box-shadow: 0 3px 8px rgba(126, 93, 179, .14);
}
.call-panel { padding: 10px; flex-shrink: 0; }
.panel-title { margin: 0 2px 8px; }
.panel-title span:last-child { font-weight: 500; font-size: 10px; letter-spacing: 0; }
.prepare-actions, .connect-actions {
  display: grid;
  gap: 7px;
}
.prepare-actions { grid-template-columns: 1fr 1fr; margin-bottom: 7px; }
.connect-actions { grid-template-columns: 1fr 1fr 1fr; }
.soft-button { background: #f0e7fb; color: #7356af; }
.mic-button {
  color: #fff;
  background: linear-gradient(135deg, #a58bdc, #8564c7);
}
.connect-button { color: white; background: #8b72ca; }
.answer-button { color: #6c529e; background: #eae1f9; }
.end-button { color: #9e637d; background: #faeaf1; }
.extras {
  padding: 0 12px;
  flex-shrink: 0;
  border-radius: 15px;
  box-shadow: none;
}
.extras summary {
  list-style: none;
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #73628c;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.extras summary::-webkit-details-marker { display: none; }
.extras summary::after { content: "⌄"; font-size: 18px; color: #a48fc8; }
.extras[open] summary::after { content: "⌃"; }
.extras-content { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 0 12px; }
.extras-content button { flex: 1 1 45%; background: #f0e7fb; color: #7356af; }
.extras-content p { width: 100%; margin: 2px 0 0; font-size: 10px; color: var(--ink-soft); }
#remoteAudio { display: none; }
@media (max-width: 370px) {
  .app-main { gap: 7px; padding-inline: 9px; }
  .call-panel { padding: 8px; }
  button { font-size: 12px; }
  .panel-title span:last-child { font-size: 9px; }
  .brand-copy p { font-size: 9px; }
}
@media (max-height: 610px) {
  body { overflow-y: auto; }
  .app-shell { height: auto; min-height: 100dvh; overflow: visible; }
  .app-main { min-height: 540px; }
  #messages { min-height: 130px; }
}
@media (prefers-reduced-motion: reduce) {
  button { transition: none; }
}
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">✦</div>
    <div class="brand-copy">
      <h1>音声トーク</h1>
      <p>声でも、文字でも、つながれる</p>
    </div>
    <span class="brand-heart" aria-hidden="true">♡</span>
  </header>

  <main class="app-main">
    <section class="connection-panel" aria-label="接続状態">
      <div class="connection-top">
        <span class="eyebrow"><span class="status-dot"></span>いまの状態</span>
        <span class="pill">ふたりの会話</span>
      </div>
      <p id="callStatus" role="status">通話マイク：OFF</p>
      <p id="incomingCallStatus" aria-live="polite">着信待機中</p>
    </section>

    <section class="chat-panel" aria-label="チャット">
      <div class="chat-heading">
        <h2><span aria-hidden="true">💬</span> メッセージ</h2>
        <span class="chat-hint">文字でやさしくお返事</span>
      </div>
      <div id="messages" role="log" aria-label="会話履歴"></div>
      <div class="controls">
        <input id="text" type="text" placeholder="メッセージを入力…" aria-label="メッセージを入力" autocomplete="off">
        <button type="button" class="icon-button" onclick="startVoiceInput()" aria-label="音声入力">🎤</button>
        <button type="button" class="send-button" onclick="send()">送信</button>
      </div>
    </section>

    <section class="call-panel" aria-label="通話操作">
      <div class="panel-title">
        <span>🎧 通話コントロール</span>
        <span>音声の準備 → マイク → 通話</span>
      </div>
      <div class="prepare-actions">
        <button type="button" class="soft-button" onclick="enableVoice()">🔊 読み上げON</button>
        <button type="button" id="callButton" class="mic-button" onclick="toggleCallMic()">📞 通話マイクON</button>
      </div>
      <div class="connect-actions">
        <button type="button" id="startCallButton" class="connect-button" onclick="startCall()">📞 通話開始</button>
        <button type="button" id="answerCallButton" class="answer-button" onclick="answerCall()">📲 応答する</button>
        <button type="button" id="endCallButton" class="end-button" onclick="endCall()">通話終了</button>
      </div>
      <audio id="remoteAudio" autoplay playsinline></audio>
    </section>

    <details class="extras">
      <summary>⚙️ ルーム・招待の設定</summary>
      <div class="extras-content">
        <button type="button" onclick="copyInviteURL()">🔗 招待URLをコピー</button>
        <button type="button" onclick="createNewRoom()">＋ 新しいルームを作成</button>
        <p>相手の新着メッセージを音声で読み上げます。</p>
      </div>
    </details>
  </main>
</div>

<script>

let callStream = null;

async function toggleCallMic() {
  const button = document.getElementById("callButton");
  const status = document.getElementById("callStatus");

  if (callStream) {
    callStream.getTracks().forEach(track => track.stop());
    callStream = null;
    button.textContent = "📞 通話マイクON";
    status.textContent = "通話マイク：OFF";
    return;
  }

  try {
    callStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });

    button.textContent = "🔴 通話マイクOFF";
    status.textContent = "マイク準備完了（接続前）";
  } catch (error) {
    console.error("マイクエラー:", error);
    alert("マイクを利用できません。Safariの許可設定を確認してください。");
  }
}

async function recoverCallMic() {
  const pc = window.getPeerConnection?.();
if (!callStream || !pc) return;

  const oldTrack = callStream.getAudioTracks()[0];
  if (!oldTrack || !oldTrack.muted) return;

  const sender = pc.getSenders()
    .find(s => s.track?.kind === "audio");

  if (!sender) return;

  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });

    const newTrack = newStream.getAudioTracks()[0];
    await sender.replaceTrack(newTrack);

    callStream.getTracks().forEach(t => t.stop());
    callStream = newStream;

    console.log("マイク再接続成功");
  } catch (error) {
    console.error("マイク再接続失敗:", error);
  }
}


async function createNewRoom() {
  if (!confirm("新しい会話ルームを作成しますか？\n現在のルームから移動します。")) return;
  if (typeof window.createFirebaseRoom !== "function") {
    alert("Firebaseの準備中です。少し待ってからお試しください。");
    return;
  }
  await window.createFirebaseRoom();
}

function copyInviteURL() {
  if (!window.roomReady) {
    alert("ルームへの接続完了後に招待URLをコピーしてください。");
    return;
  }
  const url = new URL(window.location.href);
  navigator.clipboard.writeText(url.toString())
    .then(() => alert("招待URLをコピーしました！"))
    .catch(() => prompt("このURLをコピーしてください", url.toString()));
}

let voiceEnabled = false;

function enableVoice() {
  if (!("speechSynthesis" in window)) {
    alert("この端末は音声読み上げに対応していません");
    return;
  }

  voiceEnabled = true;
  speechSynthesis.cancel();

  const test = new SpeechSynthesisUtterance(
    "音声の準備ができました"
  );
  test.lang = "ja-JP";
  speechSynthesis.speak(test);
}


function speak(message) {
  const status = document.getElementById("callStatus");

  if (!("speechSynthesis" in window)) {
    status.textContent = "読み上げ非対応";
    return;
  }

  

speechSynthesis.cancel();

const voice = new SpeechSynthesisUtterance(message);
  voice.lang = "ja-JP";
  voice.rate = 0.9;

  const voices = speechSynthesis.getVoices();
  const japanese = voices.filter(v =>
    v.lang.startsWith("ja")
  );

  const female = japanese.find(v =>
    /Kyoko|Otoya|Siri|女性/i.test(v.name)
  );

  // if (female) voice.voice = female;

  voice.onstart = () => {
    status.textContent = "🔊 読み上げ開始：" + message;
  };

  voice.onend = () => {
  status.textContent = "✅ 読み上げ完了";
  recoverCallMic();
};

  voice.onerror = (event) => {
    status.textContent = "❌ 読み上げエラー：" + event.error;
    console.error("読み上げエラー:", event.error);
  };

  status.textContent = "⏳ 読み上げ準備中：" + message;

  speechSynthesis.speak(voice);
}


function send() {
  const input = document.getElementById("text");
  const message = input.value.trim();

  if (!message) return;

  const box = document.getElementById("messages");
  const item = document.createElement("div");

  item.className = "message mine";
  item.textContent = message;

  box.appendChild(item);
  box.scrollTop = box.scrollHeight;

  input.value = "";



if (typeof window.saveMessageToFirebase === "function") {
  
  window.saveMessageToFirebase(message);
} else {
  alert("Firebase保存機能が読み込まれていません");
}

}

function startVoiceInput() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("このブラウザでは音声認識に対応していません。キーボードのマイクも利用できます。");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ja-JP";
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    document.getElementById("text").value = text;
  };

  recognition.onerror = function(event) {
    alert("音声認識エラー: " + event.error);
  };

  recognition.start();
}
</script>

<script type="module">

initializeFirestore,

  apiKey: "AIzaSyDuLI2RIVfEu5pkbJNgSXfHFFItc-aY7fg",

  appId: "1:1083145521643:web:2266cc86edd27b3babb1ae",
  measurementId: "G-WHS9YMF59V"
};

const app = initializeApp(firebaseConfig);


const db = initializeFirestore(app, {
  experimentalForceLongPolling: true
});


const auth = getAuth(app);

console.log("Firebase接続準備OK");

const rtcConfig = {
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    }
  ]
};
let peerConnection = null;
window.getPeerConnection = () => peerConnection;
let remoteAudioStream = null;

function createPeerConnection() {
  peerConnection = new RTCPeerConnection(rtcConfig);

  
peerConnection.ontrack = (event) => {
  remoteAudioStream = event.streams[0];

  const audio = document.getElementById("remoteAudio");
  audio.srcObject = remoteAudioStream;

  audio.play().catch((error) => {
    console.log("音声の自動再生待ち:", error);
  });

  console.log("相手の音声を受信しました");
};


  

peerConnection.onconnectionstatechange = () => {
  
if (!peerConnection) return;
const state = peerConnection.connectionState;


  if (state === "connected") {
    document.getElementById("endCallButton").disabled = false;
  }

  console.log("通話接続状態:", state);

  const labels = {
    new: "接続準備中",
    connecting: "接続中…",
    connected: "通話接続成功",
    disconnected: "接続が途切れました",
    failed: "接続失敗",
    closed: "通話終了"
  };

  document.getElementById("callStatus").textContent =
    labels[state] || "接続状態：" + state;
};


  return peerConnection;
}

console.log("WebRTC準備完了");

function setupIceCandidateSender(pc, callRef, role) {
  const collectionName =
    role === "caller"
      ? "offerCandidates"
      : "answerCandidates";

  const candidatesRef = collection(
    callRef,
    collectionName
  );

  pc.onicecandidate = async (event) => {
    if (!event.candidate) return;

    try {
      await addDoc(
        candidatesRef,
        event.candidate.toJSON()
      );

      console.log(
        "ICE候補を保存:",
        collectionName
      );
    } catch (error) {
      console.error(
        "ICE候補保存エラー:",
        error
      );
    }
  };
}

function setupIceCandidateReceiver(pc, callRef, role) {
  const collectionName =
    role === "caller"
      ? "answerCandidates"
      : "offerCandidates";

  const candidatesRef = collection(
    callRef,
    collectionName
  );

  return onSnapshot(candidatesRef, (snapshot) => {
    snapshot.docChanges().forEach(async (change) => {
      if (change.type !== "added") return;

      try {
        const candidate = new RTCIceCandidate(
          change.doc.data()
        );

        if (pc.remoteDescription) {
          await pc.addIceCandidate(candidate);
        } else {
          if (!pc.pendingIceCandidates) {
            pc.pendingIceCandidates = [];
          }

          pc.pendingIceCandidates.push(candidate);
        }
      } catch (error) {
        console.error("ICE候補受信エラー:", error);
      }
    });
  });
}

async function applyPendingIceCandidates(pc) {
  const candidates = pc.pendingIceCandidates || [];

  for (const candidate of candidates) {
    await pc.addIceCandidate(candidate);
  }

  pc.pendingIceCandidates = [];
}


let unsubscribeCallAnswer = null;

let activeCallId = null;

async function startCall() {
  if (!window.roomReady || !auth.currentUser || !roomId) {
    alert("ルームへの接続が完了していません");
    return;
  }

  if (!callStream) {
    alert("先に通話マイクをONにしてください");
    return;
  }

  try {
    const pc = createPeerConnection();

    callStream.getTracks().forEach((track) => {
      pc.addTrack(track, callStream);
    });

    const callRef = doc(
      collection(db, "rooms", roomId, "calls")
    );

activeCallId = callRef.id;



setupIceCandidateReceiver(pc, callRef, "caller");

    const offer = await pc.createOffer();


    

await setDoc(callRef, {
  callerId: auth.currentUser.uid,
  createdAt: serverTimestamp()
});


setupIceCandidateSender(pc, callRef, "caller");

await pc.setLocalDescription(offer);

await updateDoc(callRef, {
  offer: {
    type: offer.type,
    sdp: offer.sdp
  }
});


    console.log("通話接続要求を保存:", callRef.id);

unsubscribeCallAnswer = onSnapshot(
  callRef,
  async (snapshot) => {
    const data = snapshot.data();

if (data?.status === "ended") {
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }

  document.getElementById("callStatus").textContent =
    "相手が通話を終了しました";

// A single promise prevents startup and the create button from signing in twice.
let authReadyPromise = null;
window.roomReady = false;

function roomError(code, message) {
  return Object.assign(new Error(message), { code });
}

function diagnostic(event, context, error) {
  // Never serialize Firebase errors, room data, UIDs or tokens.
  // Only known SDK messages are retained; arbitrary messages may contain IDs.
  const messages = {
    "permission-denied": "Missing or insufficient permissions.",
    "unavailable": "The service is currently unavailable.",
    "unauthenticated": "Authentication is required."
  };
  const entry = {
    event,
    operation: context.operation,
    role: context.role,
    memberCount: context.memberCount ?? null,
    authenticated: Boolean(auth.currentUser?.uid),
    code: error?.code || null,
    message: error ? (messages[error.code] || "処理に失敗しました（詳細はコードを確認してください）") : null
  };
  console.info("[room]", entry);
}

function reportRoomError(error, context) {
  const events = {
    "permission-denied": "ROOM_ACCESS_DENIED",
    "room/full": "ROOM_FULL",
    "room/not-found": "ROOM_NOT_FOUND"
  };
  diagnostic(events[error.code] || context.operation + "_FAILED", context, error);
  const messages = {
    "permission-denied": "ルームへのアクセスが許可されませんでした。取得権限と更新権限を確認してください。",
    "room/full": "このルームは満員です。",
    "room/not-found": "ルームが見つかりません。",
    "room/invalid": "ルームの登録情報に不整合があります。",
    "room/exists": "同じIDのルームが既に存在します。新しく作成してください。",
    "auth/missing-uid": "認証情報を取得できませんでした。"
  };
  const code = /^[a-z0-9/-]+$/i.test(error.code || "") ? error.code : "unknown";
  alert("ルーム処理に失敗しました。\n処理：" + context.operation +
    "\nエラー：" + code + "\n" +
    (messages[code] || "通信状態とFirebaseの設定を確認してください。"));
}

function ensureAnonymousUser(context) {
  if (!authReadyPromise) {
    authReadyPromise = (async () => {
      context.operation = "AUTH";
      diagnostic("AUTH_START", context);
      await auth.authStateReady();
      const user = auth.currentUser || (await signInAnonymously(auth)).user;
      if (!user?.uid) throw roomError("auth/missing-uid", "認証UIDがありません");
      diagnostic("AUTH_SUCCESS", context);
      return user;
    })().catch(error => {
      authReadyPromise = null;
      throw error;
    });
  }
  return authReadyPromise;
}

let creatingRoom = false;
window.createFirebaseRoom = async () => {
  if (creatingRoom) return;
  creatingRoom = true;
  const context = { operation: "AUTH", role: "creator", memberCount: null };
  try {
    const newRoomId = crypto.randomUUID();
    const user = await ensureAnonymousUser(context);
    context.operation = "ROOM_CREATE";
    diagnostic("ROOM_CREATE_START", context);
    const roomRef = doc(db, "rooms", newRoomId);
    // Reading inside the transaction prevents overwriting even on an ID collision.
    await runTransaction(db, async transaction => {
      const snapshot = await transaction.get(roomRef);
      if (snapshot.exists()) throw roomError("room/exists", "ルームID重複");
      transaction.set(roomRef, {
        ownerId: user.uid,
        members: [user.uid],
        createdAt: serverTimestamp()
      });
    });
    context.memberCount = 1;
    diagnostic("ROOM_CREATE_SUCCESS", context);
    const url = new URL(window.location.href);
    url.search = "";
    url.searchParams.set("room", newRoomId);
    window.location.href = url.toString();
  } catch (error) {
    reportRoomError(error, context);
  } finally {
    creatingRoom = false;
  }
};

async function initializeRoom() {
  const context = { operation: "AUTH", role: "participant", memberCount: null };
  try {
    const user = await ensureAnonymousUser(context);
    const targetRoomId = new URLSearchParams(window.location.search).get("room");
    if (!targetRoomId) return;
    if (!/^[a-zA-Z0-9_-]{1,128}$/.test(targetRoomId)) {
      throw roomError("room/invalid", "不正なルームID");
    }
    const roomRef = doc(db, "rooms", targetRoomId);
    await runTransaction(db, async transaction => {
      context.operation = "ROOM_FETCH";
      context.memberCount = null;
      diagnostic("ROOM_FETCH_START", context);
      const snapshot = await transaction.get(roomRef);
      if (!snapshot.exists()) throw roomError("room/not-found", "ルームが見つかりません");
      const data = snapshot.data();
      const members = data.members;
      context.memberCount = Array.isArray(members) ? members.length : null;
      context.role = data.ownerId === user.uid ? "creator" : "participant";
      diagnostic("ROOM_FETCH_SUCCESS", context);
      if (!Array.isArray(members) || members.length < 1 ||
          members.length > 2 || typeof data.ownerId !== "string" ||
          !data.ownerId || members[0] !== data.ownerId ||
          members.some(uid => typeof uid !== "string" || !uid) ||
          new Set(members).size !== members.length) {
        throw roomError("room/invalid", "ルーム情報の不整合");
      }
      context.operation = "ROOM_JOIN";
      diagnostic("ROOM_JOIN_START", context);
      if (members.includes(user.uid)) return;
      if (members.length >= 2) throw roomError("room/full", "このルームは満員です");
      transaction.update(roomRef, { members: [data.ownerId, user.uid] });
    });
    context.memberCount = context.memberCount === 1 && context.role !== "creator"
      ? 2 : context.memberCount;
    diagnostic("ROOM_JOIN_SUCCESS", context);
    window.roomReady = true;
    startMessagesListener();
    startIncomingCallListener();
  } catch (error) {
    window.roomReady = false;
    reportRoomError(error, context);
  }
}

// Defer initialization until module declarations (including roomId) are ready.
Promise.resolve().then(initializeRoom);
