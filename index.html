<main>

    <input id="text" placeholder="メッセージを入力">
    <button onclick="send()">送信</button>
    <button onclick="startVoiceInput()">🎤</button>

<button id="callButton" onclick="toggleCallMic()">
  📞 通話マイクON
</button>

  <p>女性音声でメッセージを読み上げます。</p>

<script>

let callStream = null;

async function toggleCallMic() {
  const button = document.getElementById("callButton");
  const status = document.getElementById("callStatus");

  if (callStream) {
    callStream.getTracks().forEach(track => track.stop());
    callStream = null;
    button.textContent = "📞 通話マイクON";
    status.textContent = "通話マイク：OFF";
    return;
  }

  try {
    callStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });

    button.textContent = "🔴 通話マイクOFF";
    status.textContent = "マイク準備完了（接続前）";
  } catch (error) {
    console.error("マイクエラー:", error);
    alert("マイクを利用できません。Safariの許可設定を確認してください。");
  }
}

async function recoverCallMic() {
  const pc = window.getPeerConnection?.();
if (!callStream || !pc) return;

  const oldTrack = callStream.getAudioTracks()[0];
  if (!oldTrack || !oldTrack.muted) return;

  const sender = pc.getSenders()
    .find(s => s.track?.kind === "audio");

  if (!sender) return;

  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });

    const newTrack = newStream.getAudioTracks()[0];
    await sender.replaceTrack(newTrack);

    callStream.getTracks().forEach(t => t.stop());
    callStream = newStream;

    console.log("マイク再接続成功");
  } catch (error) {
    console.error("マイク再接続失敗:", error);
  }
}


async function createNewRoom() {
  if (!confirm("新しい会話ルームを作成しますか？\n現在のルームから移動します。")) return;
  if (typeof window.createFirebaseRoom !== "function") {
    alert("Firebaseの準備中です。少し待ってからお試しください。");
    return;
  }
  await window.createFirebaseRoom();
}

function copyInviteURL() {
  if (!window.roomReady) {
    alert("ルームへの接続完了後に招待URLをコピーしてください。");
    return;
  }
  const url = new URL(window.location.href);
  navigator.clipboard.writeText(url.toString())
    .then(() => alert("招待URLをコピーしました！"))
    .catch(() => prompt("このURLをコピーしてください", url.toString()));
}

let voiceEnabled = false;

function enableVoice() {
  if (!("speechSynthesis" in window)) {
    alert("この端末は音声読み上げに対応していません");
    return;
  }

  voiceEnabled = true;
  speechSynthesis.cancel();

  const test = new SpeechSynthesisUtterance(
    "音声の準備ができました"
  );
  test.lang = "ja-JP";
  speechSynthesis.speak(test);
}


function speak(message) {
  const status = document.getElementById("callStatus");

  if (!("speechSynthesis" in window)) {
    status.textContent = "読み上げ非対応";
    return;
  }

  

speechSynthesis.cancel();

const voice = new SpeechSynthesisUtterance(message);
  voice.lang = "ja-JP";
  voice.rate = 0.9;

  const voices = speechSynthesis.getVoices();
  const japanese = voices.filter(v =>
    v.lang.startsWith("ja")
  );

  const female = japanese.find(v =>
    /Kyoko|Otoya|Siri|女性/i.test(v.name)
  );

  // if (female) voice.voice = female;

  voice.onstart = () => {
    status.textContent = "🔊 読み上げ開始：" + message;
  };

  voice.onend = () => {
  status.textContent = "✅ 読み上げ完了";
  recoverCallMic();
};

  voice.onerror = (event) => {
    status.textContent = "❌ 読み上げエラー：" + event.error;
    console.error("読み上げエラー:", event.error);
  };

  status.textContent = "⏳ 読み上げ準備中：" + message;

  speechSynthesis.speak(voice);
}


function send() {
  const input = document.getElementById("text");
  const message = input.value.trim();

  if (!message) return;

  const box = document.getElementById("messages");
  const item = document.createElement("div");

  item.className = "message";
  item.textContent = message;

  box.appendChild(item);
  box.scrollTop = box.scrollHeight;

  input.value = "";



if (typeof window.saveMessageToFirebase === "function") {
  
  window.saveMessageToFirebase(message);
} else {
  alert("Firebase保存機能が読み込まれていません");
}

}

function startVoiceInput() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("このブラウザでは音声認識に対応していません。キーボードのマイクも利用できます。");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ja-JP";
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    document.getElementById("text").value = text;
  };

  recognition.onerror = function(event) {
    alert("音声認識エラー: " + event.error);
  };

  recognition.start();
}
</script>

function setupIceCandidateSender(pc, callRef, role) {
  const collectionName =
    role === "caller"
      ? "offerCandidates"
      : "answerCandidates";

  const candidatesRef = collection(
    callRef,
    collectionName
  );

  pc.onicecandidate = async (event) => {
    if (!event.candidate) return;

    try {
      await addDoc(
        candidatesRef,
        event.candidate.toJSON()
      );

      console.log(
        "ICE候補を保存:",
        collectionName
      );
    } catch (error) {
      console.error(
        "ICE候補保存エラー:",
        error
      );
    }
  };
}

function setupIceCandidateReceiver(pc, callRef, role) {
  const collectionName =
    role === "caller"
      ? "answerCandidates"
      : "offerCandidates";

  const candidatesRef = collection(
    callRef,
    collectionName
  );

  return onSnapshot(candidatesRef, (snapshot) => {
    snapshot.docChanges().forEach(async (change) => {
      if (change.type !== "added") return;

      try {
        const candidate = new RTCIceCandidate(
          change.doc.data()
        );

        if (pc.remoteDescription) {
          await pc.addIceCandidate(candidate);
        } else {
          if (!pc.pendingIceCandidates) {
            pc.pendingIceCandidates = [];
          }

          pc.pendingIceCandidates.push(candidate);
        }
      } catch (error) {
        console.error("ICE候補受信エラー:", error);
      }
    });
  });
}

async function applyPendingIceCandidates(pc) {
  const candidates = pc.pendingIceCandidates || [];

  for (const candidate of candidates) {
    await pc.addIceCandidate(candidate);
  }

  pc.pendingIceCandidates = [];
}

const createdAt = data.createdAt?.toMillis?.();
const isRecent =

document.getElementById(

// A single promise prevents startup and the create button from signing in twice.
let authReadyPromise = null;
window.roomReady = false;

function roomError(code, message) {
  return Object.assign(new Error(message), { code });
}

function diagnostic(event, context, error) {
  // Never serialize Firebase errors, room data, UIDs or tokens.
  // Only known SDK messages are retained; arbitrary messages may contain IDs.
  const messages = {
    "permission-denied": "Missing or insufficient permissions.",
    "unavailable": "The service is currently unavailable.",
    "unauthenticated": "Authentication is required."
  };
  const entry = {
    event,
    operation: context.operation,
    role: context.role,
    memberCount: context.memberCount ?? null,
    authenticated: Boolean(auth.currentUser?.uid),
    code: error?.code || null,
    message: error ? (messages[error.code] || "処理に失敗しました（詳細はコードを確認してください）") : null
  };
  console.info("[room]", entry);
}

function reportRoomError(error, context) {
  const events = {
    "permission-denied": "ROOM_ACCESS_DENIED",
    "room/full": "ROOM_FULL",
    "room/not-found": "ROOM_NOT_FOUND"
  };
  diagnostic(events[error.code] || context.operation + "_FAILED", context, error);
  const messages = {
    "permission-denied": "ルームへのアクセスが許可されませんでした。取得権限と更新権限を確認してください。",
    "room/full": "このルームは満員です。",
    "room/not-found": "ルームが見つかりません。",
    "room/invalid": "ルームの登録情報に不整合があります。",
    "room/exists": "同じIDのルームが既に存在します。新しく作成してください。",
    "auth/missing-uid": "認証情報を取得できませんでした。"
  };
  const code = /^[a-z0-9/-]+$/i.test(error.code || "") ? error.code : "unknown";
  alert("ルーム処理に失敗しました。\n処理：" + context.operation +
    "\nエラー：" + code + "\n" +
    (messages[code] || "通信状態とFirebaseの設定を確認してください。"));
}

function ensureAnonymousUser(context) {
  if (!authReadyPromise) {
    authReadyPromise = (async () => {
      context.operation = "AUTH";
      diagnostic("AUTH_START", context);
      await auth.authStateReady();
      const user = auth.currentUser || (await signInAnonymously(auth)).user;
      if (!user?.uid) throw roomError("auth/missing-uid", "認証UIDがありません");
      diagnostic("AUTH_SUCCESS", context);
      return user;
    })().catch(error => {
      authReadyPromise = null;
      throw error;
    });
  }
  return authReadyPromise;
}

let creatingRoom = false;
window.createFirebaseRoom = async () => {
  if (creatingRoom) return;
  creatingRoom = true;
  const context = { operation: "AUTH", role: "creator", memberCount: null };
  try {
    const newRoomId = crypto.randomUUID();
    const user = await ensureAnonymousUser(context);
    context.operation = "ROOM_CREATE";
    diagnostic("ROOM_CREATE_START", context);
    const roomRef = doc(db, "rooms", newRoomId);
    // Reading inside the transaction prevents overwriting even on an ID collision.
    await runTransaction(db, async transaction => {
      const snapshot = await transaction.get(roomRef);
      if (snapshot.exists()) throw roomError("room/exists", "ルームID重複");
      transaction.set(roomRef, {
        ownerId: user.uid,
        members: [user.uid],
        createdAt: serverTimestamp()
      });
    });
    context.memberCount = 1;
    diagnostic("ROOM_CREATE_SUCCESS", context);
    const url = new URL(window.location.href);
    url.search = "";
    url.searchParams.set("room", newRoomId);
    window.location.href = url.toString();
  } catch (error) {
    reportRoomError(error, context);
  } finally {
    creatingRoom = false;
  }
};

async function initializeRoom() {
  const context = { operation: "AUTH", role: "participant", memberCount: null };
  try {
    const user = await ensureAnonymousUser(context);
    const targetRoomId = new URLSearchParams(window.location.search).get("room");
    if (!targetRoomId) return;
    if (!/^[a-zA-Z0-9_-]{1,128}$/.test(targetRoomId)) {
      throw roomError("room/invalid", "不正なルームID");
    }
    const roomRef = doc(db, "rooms", targetRoomId);
    await runTransaction(db, async transaction => {
      context.operation = "ROOM_FETCH";
      context.memberCount = null;
      diagnostic("ROOM_FETCH_START", context);
      const snapshot = await transaction.get(roomRef);
      if (!snapshot.exists()) throw roomError("room/not-found", "ルームが見つかりません");
      const data = snapshot.data();
      const members = data.members;
      context.memberCount = Array.isArray(members) ? members.length : null;
      context.role = data.ownerId === user.uid ? "creator" : "participant";
      diagnostic("ROOM_FETCH_SUCCESS", context);
      if (!Array.isArray(members) || members.length < 1 ||
          members.length > 2 || typeof data.ownerId !== "string" ||
          !data.ownerId || members[0] !== data.ownerId ||
          members.some(uid => typeof uid !== "string" || !uid) ||
          new Set(members).size !== members.length) {
        throw roomError("room/invalid", "ルーム情報の不整合");
      }
      context.operation = "ROOM_JOIN";
      diagnostic("ROOM_JOIN_START", context);
      if (members.includes(user.uid)) return;
      if (members.length >= 2) throw roomError("room/full", "このルームは満員です");
      transaction.update(roomRef, { members: [data.ownerId, user.uid] });
    });
    context.memberCount = context.memberCount === 1 && context.role !== "creator"
      ? 2 : context.memberCount;
    diagnostic("ROOM_JOIN_SUCCESS", context);
    window.roomReady = true;
    startMessagesListener();
    startIncomingCallListener();
  } catch (error) {
    window.roomReady = false;
    reportRoomError(error, context);
  }
}

// Defer initialization until module declarations (including roomId) are ready.
Promise.resolve().then(initializeRoom);


async function saveMessage(text) {
if (!window.roomReady || !roomId) {
  alert("ルームへの接続が完了していません");
  return;
}
    if (!auth.currentUser) {
    console.error("ログインが完了していません");
    return;
  }

  try {
    

await addDoc(
  collection(db, "rooms", roomId, "messages"),
  {
  

text: text,
uid: auth.currentUser.uid,
createdAt: serverTimestamp()

  }
);
    

document.getElementById("incomingCallStatus").textContent = "Firebase保存完了：" + new Date().toLocaleTimeString();



  } catch (error) {
    console.error("メッセージ保存失敗:", error);
  alert("保存エラー: " + error.code + " / " + error.message);
  }
}

window.saveMessageToFirebase = saveMessage;

const roomId = new URLSearchParams(
  window.location.search
).get("room");

console.log("現在のルームID:", roomId);

const currentUserId = () => auth.currentUser?.uid ?? null;


function startMessagesListener() {
  if (!roomId) return;
  


const messagesQuery = query(
  collection(db, "rooms", roomId, "messages"),
  orderBy("createdAt", "desc"),
  limit(50)
);






  
  
let firstLoad = true;
let isFetchingMessages = false;

setInterval(async () => {
  if (isFetchingMessages) return;
  isFetchingMessages = true;
  try {

    

const fetchStartTime = performance.now();

document.getElementById("incomingCallStatus").textContent =
  "取得開始：" + new Date().toLocaleTimeString() + " / 通信中";

const snapshot = await getDocsFromServer(messagesQuery);

if (firstLoad) {
  window.seenMessageIds = new Set(snapshot.docs.map(doc => doc.id));
  firstLoad = false;
} else {
  const newMessages = snapshot.docs
    .filter(doc => !window.seenMessageIds.has(doc.id))
    .reverse();

  snapshot.docs.forEach(doc => window.seenMessageIds.add(doc.id));

  newMessages.forEach(doc => {
    const data = doc.data();
    
if (data.uid !== currentUserId() && data.text) {
  console.log("読み上げ実行:", data.text);
  speak(data.text);
}

  });
}


    


const latest = snapshot.docs[0]?.data();
const timeDiff = latest?.clientSentAt ? ((Date.now() - latest.clientSentAt) / 1000).toFixed(1) : "不明";
document.getElementById("incomingCallStatus").textContent = "取得：" + ((performance.now() - fetchStartTime) / 1000).toFixed(1) + "秒 / 経過：" + timeDiff + "秒 / 最新：" + (latest?.text || "なし").slice(0, 20);




const box = document.getElementById("messages");
box.replaceChildren();
snapshot.docs.slice().reverse().forEach((doc) => {
  const data = doc.data();
  const item = document.createElement("div");
  item.className = "message";
  item.textContent = data.text || "";
  if (data.uid === currentUserId()) {
    item.style.marginLeft = "20%";
    item.style.background = "#d9c8fa";
  } else {
    item.style.marginRight = "20%";
    item.style.background = "#eeeeee";
  }
  box.appendChild(item);
});
box.scrollTop = box.scrollHeight;


} catch (error) {
  console.error("定期取得エラー:", error);
} finally {
  isFetchingMessages = false;
}
}, 5000);


  

const stopRealtimeTest = () => onSnapshot(messagesQuery, { includeMetadataChanges: true }, (snapshot) => {


 



document.getElementById("callStatus").textContent = "Firebase受信：" + new Date().toLocaleTimeString() + (snapshot.metadata.fromCache ? "（キャッシュ）" : "（サーバー）");




      

    if (!firstLoad) {
      snapshot.docChanges().forEach((change) => {
        if (
          change.type === "added" &&
          !change.doc.metadata.hasPendingWrites &&
          change.doc.data().uid !== currentUserId()
        ) {
          speak(change.doc.data().text || "");
        }
      });
    }

    firstLoad = false;
  }, (error) => {
    console.error("受信エラー:", error);
    alert("受信エラー: " + error.code);
  });


}
